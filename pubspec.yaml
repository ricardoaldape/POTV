publish_to: "none"
version: 0.7.1+12

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  crypto: ^3.0.6
  dio: ^5.11.1
  encrypt: ^5.0.3
  http: ^1.6.0
  html: ^0.15.7
  file_picker: ^10.3.7
  flutter_riverpod: ^3.4.3
  quickjs_engine: ^0.1.5
