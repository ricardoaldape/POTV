name: Publish signed POTV OTA release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit on main and matching version
        env:
          POTV_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "Only commits already present on main may be released"; exit 1; }
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          data = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[0-9]+)?)\+([1-9][0-9]*)\s*$', data, re.M)
          if not match:
              raise SystemExit('POTV pubspec version must be semver+versionCode')
          tag = os.environ['POTV_TAG']
          if tag != 'v' + match.group(1):
              raise SystemExit(f'Tag {tag} does not match pubspec {match.group(1)}')
          version_code = int(match.group(2))
          Path('ota-release-notes.md').write_text(
              f'POTV-Version-Code: {version_code}\n\n'
              'Actualización oficial de POTV.\n'
              'La instalación requiere la confirmación de Android.\n',
              encoding='utf-8',
          )
          print('Release tag and Android versionCode validated:', tag, version_code)
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.potv --project-name potv .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "tool/icons/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          mkdir -p android/app/src/main/res/drawable
          cp tool/tv_banner.png android/app/src/main/res/drawable/tv_banner.png

      - name: Dependencies and QA
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Configure PRODUCTION signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!key}" || { echo "Missing required release signing secret: $key"; exit 1; }
          done
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/potv-release.keystore
          test -s android/app/potv-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=potv-release.keystore
          EOF
          python3 tool/configure_android_release_signing.py

      - name: Build signed APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          POTV_RESOLVER_ENDPOINTS_JSON: ${{ vars.POTV_RESOLVER_ENDPOINTS_JSON }}
          POTV_CONTROL_URL: ${{ vars.POTV_CONTROL_URL }}
          POTV_PARTNER_CATALOG_URL: ${{ vars.POTV_PARTNER_CATALOG_URL }}
          POTV_PARTNER_SOURCES_URL: ${{ vars.POTV_PARTNER_SOURCES_URL }}
          POTV_PARTNER_API_BASE_URL: ${{ vars.POTV_PARTNER_API_BASE_URL }}
          POTV_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=()
          for name in TMDB_API_KEY POTV_RESOLVER_ENDPOINTS_JSON POTV_CONTROL_URL POTV_PARTNER_CATALOG_URL POTV_PARTNER_SOURCES_URL POTV_PARTNER_API_BASE_URL; do
            if [ -n "${!name:-}" ]; then
              args+=("--dart-define=$name=${!name}")
            fi
          done
          flutter build apk --release "${args[@]}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/POTV-$POTV_TAG.apk"
          (cd dist && sha256sum "POTV-$POTV_TAG.apk" > "POTV-$POTV_TAG.apk.sha256")
          test -s "dist/POTV-$POTV_TAG.apk"

      - name: Verify signing and package metadata
        env:
          POTV_TAG: ${{ github.ref_name }}
          POTV_RELEASE_CERT_SHA256: ${{ vars.POTV_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SDK_TOOLS="${ANDROID_HOME}/build-tools"
          AAPT="$(find "$SDK_TOOLS" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_TOOLS" -type f -name apksigner | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "dist/POTV-$POTV_TAG.apk"
          test -n "$POTV_RELEASE_CERT_SHA256" || {
            echo "Configure POTV_RELEASE_CERT_SHA256 using the certificate from the existing installed release";
            exit 1;
          }
          actual="$("$APKSIGNER" verify --print-certs "dist/POTV-$POTV_TAG.apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 |
            tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$POTV_RELEASE_CERT_SHA256" |
            tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${#expected}" -eq 64 && test "$actual" = "$expected" || {
            echo "Signing certificate does not match the pinned production key; refusing OTA release";
            exit 1;
          }
          "$AAPT" dump badging "dist/POTV-$POTV_TAG.apk" | head -1 |
            grep -E "name='com\.potv\.potv'"
          test "$(grep -c 'POTV-Version-Code:' ota-release-notes.md)" -eq 1

      - name: Publish immutable POTV GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
          body_path: ota-release-notes.md
          files: |
            dist/POTV-*.apk
            dist/POTV-*.apk.sha256
          fail_on_unmatched_files: true
