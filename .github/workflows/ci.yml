name: POTV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: potv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce subscription contract on every update
        run: python3 tool/verify_subscription_contract.py

      - name: Require permanent POTV animated branding
        run: python3 tool/verify_branding_assets.py

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify committed Android platform
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/potv/potv/MainActivity.kt
          test -f android/app/src/main/res/xml/potv_update_paths.xml

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Validate resolver build config
        env:
          POTV_RESOLVER_ENDPOINTS_JSON: ${{ vars.POTV_RESOLVER_ENDPOINTS_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get('POTV_RESOLVER_ENDPOINTS_JSON', '').strip()
          if not raw:
              print('POTV resolver endpoints: 0 (runtime/local providers only)')
          else:
              data = json.loads(raw)
              if not isinstance(data, list):
                  raise SystemExit('POTV_RESOLVER_ENDPOINTS_JSON must be a JSON list')
              print(f'POTV resolver endpoints configured: {len(data)}')
          PY

      - name: Build QA APK (not OTA)
        id: qa_apk
        # Artifact is advisory; SDK/NDK mirror outages must not disable
        # the mandatory account, billing, Flutter and analyzer checks.
        continue-on-error: true
        env:
          POTV_RESOLVER_ENDPOINTS_JSON: ${{ vars.POTV_RESOLVER_ENDPOINTS_JSON }}
          POTV_CONTROL_URL: ${{ vars.POTV_CONTROL_URL }}
          POTV_PARTNER_CATALOG_URL: ${{ vars.POTV_PARTNER_CATALOG_URL }}
          POTV_PARTNER_SOURCES_URL: ${{ vars.POTV_PARTNER_SOURCES_URL }}
          POTV_PARTNER_API_BASE_URL: ${{ vars.POTV_PARTNER_API_BASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          args=()
          if [ -n "$POTV_RESOLVER_ENDPOINTS_JSON" ]; then
            args+=("--dart-define=POTV_RESOLVER_ENDPOINTS_JSON=$POTV_RESOLVER_ENDPOINTS_JSON")
          fi
          if [ -n "$POTV_PARTNER_API_BASE_URL" ]; then
            args+=("--dart-define=POTV_PARTNER_API_BASE_URL=$POTV_PARTNER_API_BASE_URL")
          fi
          if [ -n "$POTV_PARTNER_SOURCES_URL" ]; then
            args+=("--dart-define=POTV_PARTNER_SOURCES_URL=$POTV_PARTNER_SOURCES_URL")
          fi
          if [ -n "$POTV_PARTNER_CATALOG_URL" ]; then
            args+=("--dart-define=POTV_PARTNER_CATALOG_URL=$POTV_PARTNER_CATALOG_URL")
          fi
          if [ -n "$POTV_CONTROL_URL" ]; then
            args+=("--dart-define=POTV_CONTROL_URL=$POTV_CONTROL_URL")
          fi
          if [ -n "$TMDB_API_KEY" ]; then
            args+=("--dart-define=TMDB_API_KEY=$TMDB_API_KEY")
          fi
          flutter build apk --debug "${args[@]}"

      - name: Upload APK
        if: ${{ steps.qa_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: POTV-QA-DEBUG-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
