name: POTV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: potv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.potv --project-name potv .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp tool/icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp tool/icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp tool/icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp tool/icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp tool/icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/drawable
          cp tool/tv_banner.png android/app/src/main/res/drawable/tv_banner.png

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build V4 APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POTV-V4-APK
          path: build/app/outputs/flutter-apk/app-release.apk
