name: POTV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: potv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.potv --project-name potv .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp tool/icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp tool/icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp tool/icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp tool/icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp tool/icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/drawable
          cp tool/tv_banner.png android/app/src/main/res/drawable/tv_banner.png

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate resolver build config
        env:
          POTV_RESOLVER_ENDPOINTS_JSON: ${{ vars.POTV_RESOLVER_ENDPOINTS_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get('POTV_RESOLVER_ENDPOINTS_JSON', '').strip()
          if not raw:
              print('POTV resolver endpoints: 0 (runtime/local providers only)')
          else:
              data = json.loads(raw)
              if not isinstance(data, list):
                  raise SystemExit('POTV_RESOLVER_ENDPOINTS_JSON must be a JSON list')
              print(f'POTV resolver endpoints configured: {len(data)}')
          PY

      - name: Build V6 APK
        env:
          POTV_RESOLVER_ENDPOINTS_JSON: ${{ vars.POTV_RESOLVER_ENDPOINTS_JSON }}
          POTV_CONTROL_URL: ${{ vars.POTV_CONTROL_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          args=()
          if [ -n "$POTV_RESOLVER_ENDPOINTS_JSON" ]; then
            args+=("--dart-define=POTV_RESOLVER_ENDPOINTS_JSON=$POTV_RESOLVER_ENDPOINTS_JSON")
          fi
          if [ -n "$POTV_CONTROL_URL" ]; then
            args+=("--dart-define=POTV_CONTROL_URL=$POTV_CONTROL_URL")
          fi
          if [ -n "$TMDB_API_KEY" ]; then
            args+=("--dart-define=TMDB_API_KEY=$TMDB_API_KEY")
          fi
          flutter build apk --release "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POTV-V6-APK
          path: build/app/outputs/flutter-apk/app-release.apk
