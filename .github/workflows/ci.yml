name: POTV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: potv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.potv --project-name potv .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: potv-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
