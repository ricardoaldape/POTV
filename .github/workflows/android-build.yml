name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate missing platform folders
        run: flutter create --platforms=android --org com.potv --project-name potv .

      - name: Decode release keystore
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/potv-release.keystore
          test -s android/app/potv-release.keystore

      - name: Create key.properties
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=potv-release.keystore
          EOF

      - name: Configure Gradle release signing
        run: python3 tool/configure_android_release_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          POTV_SIGNED_FLAGS_URL: ${{ vars.POTV_SIGNED_FLAGS_URL }}
          POTV_FLAGS_ED25519_PUBLIC_KEY: ${{ vars.POTV_FLAGS_ED25519_PUBLIC_KEY }}
        shell: bash
        run: |
          args=()
          if [ -n "$POTV_SIGNED_FLAGS_URL" ] && [ -n "$POTV_FLAGS_ED25519_PUBLIC_KEY" ]; then
            args+=("--dart-define=POTV_SIGNED_FLAGS_URL=$POTV_SIGNED_FLAGS_URL")
            args+=("--dart-define=POTV_FLAGS_ED25519_PUBLIC_KEY=$POTV_FLAGS_ED25519_PUBLIC_KEY")
          elif [ -n "$POTV_SIGNED_FLAGS_URL" ] || [ -n "$POTV_FLAGS_ED25519_PUBLIC_KEY" ]; then
            echo "Both signed flag build variables are required." >&2
            exit 1
          fi
          flutter build apk --release "${args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
