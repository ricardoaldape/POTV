name: POTV Android emulator QA smoke

# Deliberately independent from signed OTA releases. Debug APKs use the
# .qa suffix; never overwrite subscribers' production installation.
on:
  workflow_dispatch:
    inputs:
      successful_ci_run_id:
        description: "Successful POTV CI run ID containing POTV-QA-DEBUG-APK"
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch QA APK from previously validated CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.successful_ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{8,15}$ ]] || { echo "Invalid run identifier"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '.workflow_id,.conclusion,.head_branch' > /tmp/qa-source-run.txt
          test "$(sed -n '2p' /tmp/qa-source-run.txt)" = success
          test "$(sed -n '3p' /tmp/qa-source-run.txt)" = main
          mkdir -p /tmp/potv-qa
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name POTV-QA-DEBUG-APK \
            --dir /tmp/potv-qa
          test -s /tmp/potv-qa/app-debug.apk
          sha256sum /tmp/potv-qa/app-debug.apk | tee /tmp/potv-qa.sha256

      - name: Enable KVM acceleration on disposable hosted runner
        run: |
          set -eu
          test -e /dev/kvm || { echo 'KVM device unavailable on runner'; exit 1; }
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install and launch POTV QA on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4a
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            # android-emulator-runner invokes this block with /usr/bin/sh, not bash.
            # dash rejects `set -o pipefail`; keep strict POSIX error checking.
            set -eu
            adb wait-for-device
            adb install -r /tmp/potv-qa/app-debug.apk
            # Each emulator action line runs in its own /bin/sh.
            # Keep the PID check in one command; retain diagnostics on failure.
            adb shell am start -n com.potv.potv.qa/com.potv.potv.MainActivity
            sleep 25
            adb logcat -d -t 1600 > /tmp/potv-qa-logcat.txt
            adb shell screencap -p /sdcard/potv-qa-screen.png
            adb pull /sdcard/potv-qa-screen.png /tmp/potv-qa-screen.png
            # A running PID alone is not proof that the app is visible.
            # Earlier CI passed while a Google Play services ANR covered a black screen.
            adb shell dumpsys activity activities > /tmp/potv-qa-activity.txt
            adb shell dumpsys window > /tmp/potv-qa-window.txt
            adb shell pidof com.potv.potv.qa | grep -Eq '[0-9]' || { echo 'POTV QA process not alive'; exit 1; }
            grep -E 'topResumedActivity|mResumedActivity' /tmp/potv-qa-activity.txt | grep -F 'com.potv.potv.qa/' || { echo 'POTV QA is not the resumed activity'; exit 1; }
            grep 'mCurrentFocus=' /tmp/potv-qa-window.txt | grep -F 'com.potv.potv.qa/' || { echo 'POTV QA is not the focused window (possible system ANR/dialog)'; exit 1; }
            ! grep -E 'FATAL EXCEPTION:|Process: com[.]potv[.]potv[.]qa.*FATAL' /tmp/potv-qa-logcat.txt
            echo 'POTV QA process alive, resumed and foreground focused'

      - name: Preserve QA logs and launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POTV-ANDROID-EMULATOR-QA
          path: |
            /tmp/potv-qa-screen.png
            /tmp/potv-qa-logcat.txt
            /tmp/potv-qa-activity.txt
            /tmp/potv-qa-window.txt
            /tmp/potv-qa.sha256
          if-no-files-found: warn
          retention-days: 7
